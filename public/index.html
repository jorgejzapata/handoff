<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handoff</title>
  <meta name="description" content="Student subleases near CSU. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Nunito:wght@900&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #F8F8F1;
      --ink: #203A2E;
      --muted: #6B7169;
      --forest-600: #3A6447;
      --lime-300: #CFED85;
      --pillar: #203A2E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #121A15;
        --ink: #ECF0E6;
        --muted: #9AA39A;
        --forest-600: #A9C99A;
        --pillar: #F8F8F1;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--canvas);
      color: var(--ink);
      font: 400 14px/20px Inter, system-ui, sans-serif;
      text-align: center;
    }
    .eyebrow {
      font-size: 11px;
      line-height: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--forest-600);
      margin: 24px 0 8px;
    }
    h1 {
      font: 900 34px/36px Nunito, ui-rounded, sans-serif;
      letter-spacing: -0.01em;
    }
    p.body { color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 96 80" width="96" height="80" role="img" aria-label="Handoff">
      <rect x="12" y="8" width="20" height="64" rx="10" fill="var(--pillar)"/>
      <rect x="50" y="8" width="20" height="64" rx="10" fill="var(--pillar)"/>
      <rect x="12" y="30" width="78" height="20" rx="10" fill="var(--lime-300)"/>
    </svg>
    <p class="eyebrow">Subleases near CSU</p>
    <h1>handoff</h1>
    <p class="body">Coming soon.</p>
  </main>
</body>
</html>
