<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Handoff</title>
    <!-- share:start (listing pages swap this block for the listing's own preview) -->
    <meta name="description" content="Sublets and lease takeovers from verified CSU students. Find a room for a semester, or hand off your lease to another Ram." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Handoff" />
    <meta property="og:title" content="Handoff: student sublets near CSU" />
    <meta property="og:description" content="Find a room for a semester, or hand off your lease to another Ram." />
    <meta property="og:url" content="https://handoffsublease.com/" />
    <meta property="og:image" content="https://handoffsublease.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Handoff: A little less rent. A lot more possibility." />

    <meta name="theme-color" content="#F8F8F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121A15" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Handoff" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the saved theme before first paint, so there's no flash.
      try {
        var t = localStorage.getItem('handoff:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet" />

  </body>
